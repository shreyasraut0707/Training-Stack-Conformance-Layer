# CPU-only CI (spec Section 12.3): tests and the G3 controls on every change, across the
# pinned stack and the latest releases; the regression bank on Windows (the bank's pinned
# PyPI PyTorch builds are CPU-only there); a weekly run against upstream main.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC: the weekly upstream run

permissions:
  contents: read

# A newer push to the same branch cancels the older run, and every job has a time limit:
# runs of a private repository draw on the account's limited monthly Actions allowance.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  tests:
    if: github.event_name != 'schedule'
    timeout-minutes: 90
    # The pinned stack must pass; the latest releases are informational (upstream moves often).
    continue-on-error: ${{ matrix.stack == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        stack: [pinned, latest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the pinned stack (bank/envs/conform.txt)
        if: matrix.stack == 'pinned'
        run: |
          python -m pip install -r bank/envs/conform.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
      - name: Install the latest releases
        if: matrix.stack == 'latest'
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[stack,dev]"
      - name: Download tokenizer files (no weights)
        run: python scripts/download_targets.py
      - name: Tests
        run: python -m pytest -q
      - name: G3 controls
        run: python scripts/run_controls.py --python "$(which python)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.stack }}
          path: bank/results/

  bank:
    if: github.event_name != 'pull_request'
    timeout-minutes: 150
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Main environment and tokenizers
        shell: pwsh
        run: |
          python -m pip install -r bank/envs/conform.txt --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . --no-deps
          python scripts/download_targets.py
      - name: Bank environments
        run: python scripts/setup_bank_envs.py --venv-root .venvs
      - name: Regression bank
        run: python scripts/run_bank.py --venv-root .venvs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bank-results
          path: bank/results/

  upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install upstream main of Transformers and TRL
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[stack,dev]"
          python -m pip install --upgrade "git+https://github.com/huggingface/transformers" "git+https://github.com/huggingface/trl"
          python scripts/download_targets.py
      - name: Controls on upstream main (a changed verdict needs triage, spec Figure 14)
        run: python scripts/run_controls.py --python "$(which python)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-results
          path: bank/results/
